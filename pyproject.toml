[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dip_lab_tasks"
version = "1.0.0"
description = "Digital Image Processing Lab Tasks & Algorithmic Foundations"
readme = "README.md"
authors = [{ name = "Anuj Bajpayee", email = "anujbajpayee14@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["task_1_tambola_ticket_generator", "task_2_rgb_to_greyscale_conversion"]
addopts = "-v"
python_files = ["test_*.py"]
